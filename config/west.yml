manifest:
  remotes:
    - name: ftc
      url-base: https://github.com/ftc/
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
      revision: v0.3 # Pin everything to v0.3
    - name: urob
      url-base: https://github.com/urob
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml

          # ZMK modules
    - name: zmk-adaptive-key
      path: modules/zmk/adaptive-key
    - name: zmk-auto-layer
      path: modules/zmk/auto-layer
    - name: zmk-helpers
      path: modules/zmk/helpers
    - name: zmk-leader-key
      path: modules/zmk/leader-key
    - name: zmk-tri-state
      path: modules/zmk/tri-state
    - name: zmk-unicode
      path: modules/zmk/unicode
      
    - name: zmk
      remote: urob
      revision: main
      #revision: mouse-ftc
      import: app/west.yml
  self:
    path: config
